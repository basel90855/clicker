<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Mariam's Playground</title>
  <meta name="theme-color" content="#0d0b1f" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700&family=Poppins:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="bg-ornaments" aria-hidden="true"></div>
  <canvas id="confettiCanvas" aria-hidden="true"></canvas>

  <main class="stage" aria-live="polite">
    <h1 class="title">Welcome, <span class="gradient">Mariam</span> ✨</h1>
    <button id="mariamButton" class="neon-btn" aria-label="Hello Mariam">Hello Mariam</button>
    <p class="subtitle">Tap the button and chase it around</p>
  </main>

  <script src="./script.js"></script>
</body>
</html>
